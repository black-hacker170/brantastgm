name: Install NeuroQuest project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-neuroquest.yml"

permissions:
  contents: write

jobs:
  install-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and install project files
        shell: bash
        run: |
          set -euo pipefail

          test -f .bootstrap/neuroquest.01.part
          test -f .bootstrap/neuroquest.02.part
          test -f .bootstrap/neuroquest.03.part
          test -f .bootstrap/neuroquest.04.part
          test -f .bootstrap/neuroquest.05.part
          test -f .bootstrap/neuroquest.06.part

          cat .bootstrap/neuroquest.0{1..6}.part > /tmp/neuroquest.zip.b64
          base64 --decode /tmp/neuroquest.zip.b64 > /tmp/neuroquest.zip
          unzip -tq /tmp/neuroquest.zip
          mkdir -p /tmp/neuroquest-extract
          unzip -q /tmp/neuroquest.zip -d /tmp/neuroquest-extract
          test -f /tmp/neuroquest-extract/neuroquest/app.py
          cp -a /tmp/neuroquest-extract/neuroquest/. .

          rm -rf .bootstrap /tmp/neuroquest-extract /tmp/neuroquest.zip /tmp/neuroquest.zip.b64

          python -m py_compile app.py
          node --check static/game.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install NeuroQuest brain training platform"
          git push
